<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>대구 MaaS 이용가이드</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{--fg:#15171a;--muted:#68707a;--line:#e9ebee;--card:#fff;--bg:#f5f6f8;--accent:#1769e0}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{max-width:720px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:#111;color:white;display:grid;place-items:center;font-weight:800}
.title b{display:block;font-size:18px}.title span{font-size:12px;color:var(--muted)}
main{max-width:720px;margin:auto;padding:20px 16px 90px}.hero{padding:10px 2px 20px}.hero h1{font-size:28px;line-height:1.25;margin:4px 0 8px}.hero p{color:var(--muted);line-height:1.6;margin:0}
.search{margin:16px 0 20px}.search input{width:100%;border:1px solid var(--line);background:white;border-radius:16px;padding:15px 16px;font-size:16px;outline:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;min-height:135px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.025)}
.card .ico{font-size:28px}.card h3{margin:12px 0 5px;font-size:17px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.section{display:none}.section.active{display:block}.back{border:0;background:white;border-radius:13px;padding:10px 13px;font-size:14px;margin-bottom:12px}.guide{background:white;border:1px solid var(--line);border-radius:22px;padding:20px}.guide h2{margin-top:0}.step{display:flex;gap:14px;padding:15px 0;border-top:1px solid var(--line)}.step:first-of-type{border-top:0}.num{flex:0 0 30px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font-weight:700}.step b{display:block;margin:3px 0 5px}.step span{color:var(--muted);font-size:14px;line-height:1.55}.note{margin-top:16px;background:#f1f5fb;border-radius:15px;padding:14px;font-size:13px;line-height:1.55}
footer{text-align:center;color:#8a9098;font-size:12px;padding:25px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="top"><div class="logo">M</div><div class="title"><b>대구 MaaS 이용가이드</b><span>하나의 앱으로 이동부터 생활까지</span></div></div></header>
<main>
<section id="home" class="section active">
 <div class="hero"><h1>어떤 기능이<br>궁금하세요?</h1><p>대구 MaaS의 주요 기능을 선택하면 이용 순서를 빠르게 확인할 수 있습니다.</p></div>
 <div class="search"><input id="q" placeholder="길찾기, DRT, 교통카드, 마일리지 검색"></div>
 <div class="grid" id="grid"></div>
 <footer>대구형 MaaS 플랫폼 · 이용가이드 PWA</footer>
</section>
<section id="detail" class="section"><button class="back" onclick="goHome()">← 전체 메뉴</button><div id="content"></div></section>
</main>
<script>
const items=[
["route","🧭","길찾기","대중교통·DRT·PM·보행을 연계한 경로 확인",
 [["출발지와 도착지 선택","현재 위치 또는 원하는 장소를 출발·도착지로 지정합니다."],["추천 경로 확인","제공되는 경로별 이동시간·거리·교통수단 정보를 비교합니다."],["상세 이동정보 확인","환승과 보행 등 구간별 이동 순서를 확인합니다."]]],
["transit","🚇","도시철도·버스","노선·정류장·운행정보 확인",
 [["교통수단 선택","길찾기 또는 교통정보 화면에서 도시철도·버스를 확인합니다."],["노선·정류장 확인","노선과 역·정류장 정보를 확인합니다."],["운행정보 확인","제공되는 도착 및 운행정보를 확인합니다."]]],
["drt","🚐","DRT","수요응답형 교통 조회·호출 이용",
 [["DRT 포함 경로 확인","길찾기 결과에서 DRT가 포함된 경로를 확인합니다."],["호출·예약 정보 확인","탑승 위치와 이용 정보를 확인한 뒤 호출 또는 예약을 진행합니다."],["탑승정보 확인","배차 및 이용 관련 안내를 확인합니다."]]],
["pm","🚲","PM·자전거","공유 자전거 연계 이용",
 [["PM 경로 확인","길찾기 결과에서 PM·자전거 연계 경로를 선택합니다."],["대여정보 확인","연계 사업자의 이용 가능 정보를 확인합니다."],["대여·반납","서비스 안내에 따라 대여하고 지정 방식으로 반납합니다."]]],
["card","💳","교통카드","교통카드 등록·조회·충전 기능",
 [["카드 메뉴 이동","앱의 교통카드 관련 메뉴를 선택합니다."],["카드 등록·조회","지원되는 모바일 또는 실물 교통카드를 등록하고 정보를 확인합니다."],["충전·이용","제공되는 카드 기능에 따라 충전 후 대중교통 이용에 사용합니다."]]],
["pay","📱","결제","NFC·QR 등 연계 결제 이용",
 [["결제수단 확인","이용하려는 교통수단에서 지원되는 결제방식을 확인합니다."],["결제 진행","앱 안내에 따라 NFC 또는 QR 등 지원 방식으로 결제합니다."],["이용내역 확인","결제·이용 후 관련 내역을 확인합니다."]]],
["benefit","🎁","마일리지·쿠폰","이용 혜택 확인",
 [["혜택 메뉴 이동","마일리지 또는 쿠폰 메뉴를 선택합니다."],["보유내역 확인","적립된 마일리지와 사용 가능한 쿠폰을 확인합니다."],["혜택 이용","각 혜택의 이용조건과 안내에 따라 사용합니다."]]],
["info","🅿️","생활편의","날씨·주차장 등 편의정보",
 [["편의정보 선택","앱에서 제공하는 생활·편의정보 메뉴를 선택합니다."],["정보 확인","날씨, 주차장 등 제공되는 정보를 확인합니다."],["이동계획에 활용","경로와 주변 정보를 함께 참고해 이동계획을 세웁니다."]]],
["account","👤","회원·설정","회원가입·로그인·사용자 설정",
 [["회원가입","본인인증 등 앱에서 안내하는 절차에 따라 가입합니다."],["로그인","등록한 계정 또는 지원되는 로그인 방식으로 접속합니다."],["내 정보 관리","사용자 정보와 서비스 설정을 확인·관리합니다."]]],
["faq","❓","자주 묻는 질문","이용 중 궁금한 사항 빠르게 확인",
 [["기능을 먼저 확인하세요","홈 화면 검색창에서 궁금한 기능명을 입력합니다."],["이용 안내를 확인하세요","각 기능별 이용 순서와 참고사항을 확인합니다."],["실제 앱 안내 우선","서비스 운영·정책·지원 범위가 변경된 경우 실제 MaaS 앱의 최신 안내를 우선 확인합니다."]]]
];
const grid=document.getElementById("grid");
function draw(list){grid.innerHTML=list.map(x=>`<div class="card" onclick="openItem('${x[0]}')"><div class="ico">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p></div>`).join("")}
draw(items);
document.getElementById("q").addEventListener("input",e=>{let s=e.target.value.trim().toLowerCase();draw(items.filter(x=>(x[2]+" "+x[3]).toLowerCase().includes(s)))});
function openItem(id){let x=items.find(v=>v[0]===id);document.getElementById("home").classList.remove("active");document.getElementById("detail").classList.add("active");document.getElementById("content").innerHTML=`<div class="guide"><div style="font-size:36px">${x[1]}</div><h2>${x[2]}</h2><p style="color:#68707a">${x[3]}</p>${x[4].map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join("")}<div class="note">※ 본 가이드는 현재 확인된 대구형 MaaS 서비스 구성에 맞춘 초안입니다. 실제 배포 전 최종 앱 화면·메뉴명·운영정책에 맞춰 화면 캡처와 문구를 확정하는 것을 권장합니다.</div></div>`;scrollTo(0,0)}
function goHome(){document.getElementById("detail").classList.remove("active");document.getElementById("home").classList.add("active");scrollTo(0,0)}
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
</script>
</body></html>
