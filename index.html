<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B78F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="대구 MaaS 안내">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>대구 MaaS 사용설명서</title>
</head>
<body>
  <header class="hero">
    <div class="brand">D · 대구 MaaS</div>
    <h1>사용설명서</h1>
    <p>길찾기부터 교통카드, DRT, 공유자전거까지<br>필요한 기능을 빠르게 확인하세요.</p>

    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="기능 검색 (예: 교통카드, DRT)" autocomplete="off">
    </label>
  </header>

  <section class="section">
    <div class="section-head">
      <h2>자주 찾는 기능</h2>
      <span>빠른 안내</span>
    </div>

    <div class="quick-grid">
      <button class="quick" data-open="route"><b>🧭</b><span>길찾기</span></button>
      <button class="quick" data-open="card"><b>💳</b><span>교통카드</span></button>
      <button class="quick" data-open="drt"><b>🚐</b><span>DRT</span></button>
      <button class="quick" data-open="bike"><b>🚲</b><span>자전거</span></button>
    </div>
  </section>

  <main class="section">
    <div class="section-head">
      <h2>사용 가이드</h2>
      <span>항목을 눌러보세요</span>
    </div>

    <div id="guideList"></div>
    <div id="emptyState" class="empty">검색 결과가 없어요.</div>
  </main>

  <section class="notice">
    <strong>아이폰 이용 안내</strong>
    <p>아이폰은 버스·도시철도·DRT의 NFC 휴대폰 접촉식 결제가 제한됩니다. 노선 조회와 DRT 호출, 공유자전거 대여, 매장 QR 결제 및 이력관리는 이용할 수 있습니다.</p>
  </section>

  <nav class="bottom-nav">
    <button class="active" data-home><b>⌂</b><span>홈</span></button>
    <button data-open="route"><b>⌕</b><span>길찾기</span></button>
    <button data-open="card"><b>▣</b><span>교통카드</span></button>
    <button data-search-focus><b>☰</b><span>기능찾기</span></button>
  </nav>

  <dialog id="detailDialog">
    <div class="sheet">
      <div class="handle"></div>
      <h3 id="detailTitle"></h3>
      <p id="detailSubtitle" class="sub"></p>
      <div id="detailSteps"></div>
      <button id="closeDialog" class="close-btn">닫기</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
